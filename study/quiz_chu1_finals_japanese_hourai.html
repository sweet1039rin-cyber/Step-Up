<body>

<h1>中1国語 読解予想問題 蓬莱の玉の枝（竹取物語）</h1>
<p>※この予想問題は、国語の学習（ワークブック）P102〜107の学習内容をもとに作ったものです。歴史的仮名遣いの直し方と古語の意味、物語の内容を確かめましょう。</p>
<p class="randinfo">🎲 全26問をシャッフルして出しています。もう一度開くと順番が変わります。</p>
<hr />
<div id="quizArea"></div>

<section class="mpanel" id="mistakePanel">
<h2>✍️ まちがい記録</h2>
<p>まちがえた問題の「まちがえた」にチェックを入れて「記録する」を押すと、まちがい復習ボックスに残ります。あとで復習ページに出てきます。</p>
<button type="button" class="mbtn" id="mpSave">記録する</button>

<script>
var QUESTIONS = [{"id": 1, "cat": "歴史的仮名遣い", "q": "歴史的仮名遣い「いふ」の、現代の読み方として正しいものを選びなさい。<br />ア いう　イ いふ　ウ ゆう　エ よう", "a": "<strong>ア</strong><br />語頭以外のハ行は「わいうえお」に直します。「いふ」は「いう」と読みます。"}, {"id": 2, "cat": "歴史的仮名遣い", "q": "「使ひけり」を現代仮名遣いに直したものとして正しいものを選びなさい。<br />ア つかいけり　イ つかひけり　ウ つかうけり　エ つかえけり", "a": "<strong>ア</strong><br />「ひ」は語頭以外なので「い」に直し、「使ひけり」→「つかいけり」となります。"}, {"id": 3, "cat": "歴史的仮名遣い", "q": "「よそほひ」を現代仮名遣いに直したものとして正しいものを選びなさい。<br />ア よそほい　イ よそおい　ウ よそひい　エ よそおひ", "a": "<strong>イ</strong><br />「ほ」は「お」に、「ひ」は「い」に直します。装う（身なりを整える）という意味の言葉です。"}, {"id": 4, "cat": "歴史的仮名遣い", "q": "「よろづ」を現代仮名遣いに直したものとして正しいものを選びなさい。<br />ア よろつ　イ よろず　ウ よろづ　エ よろす", "a": "<strong>イ</strong><br />「づ」は、ほとんどの場合「ず」に直します。"}, {"id": 5, "cat": "歴史的仮名遣い", "q": "「けふ」の、現代の読み方として正しいものを選びなさい。<br />ア きょう　イ けふ　ウ きふ　エ けい", "a": "<strong>ア</strong><br />「efu」の音は「you」と読みます。「けふ」は「きょう（今日）」です。"}, {"id": 6, "cat": "古語の意味", "q": "古語「けり」の意味として正しいものを選びなさい。<br />ア 〜た（過去）　イ 〜だろう　ウ 〜なさい　エ 〜ている", "a": "<strong>ア</strong><br />「けり」は過去を表し、「〜た」と訳します。"}, {"id": 7, "cat": "古語の意味", "q": "古語「ゐたり」の意味として正しいものを選びなさい。<br />ア 立っていた　イ 座っていた　ウ 歩いていた　エ 寝ていた", "a": "<strong>イ</strong><br />「ゐ」は「居る」で、「ゐたり」は「座っていた」という意味です。"}, {"id": 8, "cat": "古語の意味", "q": "古語「いとうつくしう」の意味として正しいものを選びなさい。<br />ア とてもかわいらしく　イ 少し不思議に　ウ 大変恐ろしく　エ なつかしく", "a": "<strong>ア</strong><br />「いと」は「とても」、「うつくし」は「かわいい」という意味です。"}, {"id": 9, "cat": "内容理解", "q": "『蓬莱の玉の枝』のあらましの順序として正しいものを選びなさい。<br />ア 貴公子たちからの求婚→かぐや姫の成長→月に帰るかぐや姫→その後の帝　イ かぐや姫の成長→貴公子たちからの求婚→月に帰るかぐや姫→その後の帝　ウ 月に帰るかぐや姫→かぐや姫の成長→その後の帝→貴公子たちからの求婚　エ かぐや姫の成長→月に帰るかぐや姫→貴公子たちからの求婚→その後の帝", "a": "<strong>イ</strong><br />竹の中で見つかった子供が成長し、求婚を受け、中秋の名月の夜に月へ帰り、最後に帝のその後が語られます。"}, {"id": 10, "cat": "内容理解", "q": "くらもちの皇子に出された難題として正しいものを選びなさい。<br />ア 蓬莱の玉の枝　イ 仏の御石の鉢　ウ 火鼠の皮衣　エ 龍の首の珠", "a": "<strong>ア</strong><br />くらもちの皇子は「蓬莱の玉の枝」です。仏の御石の鉢は石作の皇子、火鼠の皮衣は右大臣阿部御主人、龍の首の珠は大納言大伴御行、燕の子安貝は中納言石上麿足です。"}, {"id": 11, "cat": "内容理解", "q": "くらもちの皇子の策略がばれた理由として正しいものを選びなさい。<br />ア かぐや姫が見破った　イ 玉の枝を作った匠たちが、代金を求めてやって来た　ウ 翁が本物と見比べた　エ 皇子が自分で話してしまった", "a": "<strong>イ</strong><br />三年間籠もって「にせの玉の枝」を作らせましたが、代金を求める匠たちの登場でばれました。"}, {"id": 12, "cat": "内容理解", "q": "この物語で「策略」という言葉が表す意味として最も適切なものを選びなさい。<br />ア うそをついてだますこと　イ 力を合わせて働くこと　ウ 遠くへ旅に出ること　エ 約束を守ること", "a": "<strong>ア</strong><br />ここでの「策略」は、うそをついてだます工夫という意味です。"}, {"id": 13, "cat": "内容理解", "q": "帝が、かぐや姫を宮中に迎えることを諦めた理由として正しいものを選びなさい。<br />ア 翁が反対したから　イ かぐや姫が宮中に入ることを嫌い、強く望まなかったから　ウ 月の使いが来たから　エ 帝が病気になったから", "a": "<strong>イ</strong><br />かぐや姫が宮中に入ることを嫌ったため、帝は迎えるのを諦めました。"}, {"id": 14, "cat": "内容理解", "q": "かぐや姫が帝に残していった二つのものとして正しいものを選びなさい。<br />ア 手紙と不死の薬　イ 羽衣と手紙　ウ 玉の枝と不死の薬　エ 鏡と手紙", "a": "<strong>ア</strong><br />かぐや姫は、手紙を添えて不死の薬を残しました。帝はそれを駿河の国の山で燃やさせました。"}, {"id": 15, "cat": "内容理解", "q": "「ふじの山」（富士山）の名前の由来の説明として正しいものを選びなさい。<br />ア 山の形が富士山に似ていたから　イ 使者が兵士（士）たちをたくさん引き連れて登ったことから、「士に富む山」と名付けられた　ウ 不死の薬の煙が白かったから　エ かぐや姫が名付けたから", "a": "<strong>イ</strong><br />「士に富む」から「ふじの山」となった、という物語の中の由来です。"}, {"id": 16, "cat": "内容理解", "q": "物語に出てくる長さの表し方として正しいものを選びなさい。<br />ア 三寸は約9センチ、五尺は約150センチ　イ 三寸は約30センチ、五尺は約50センチ　ウ 三寸は約3センチ、五尺は約500センチ　エ 三寸は約90センチ、五尺は約15センチ", "a": "<strong>ア</strong><br />一寸は約3センチ、一尺は約30センチで計算します。"}, {"id": 17, "cat": "記述", "q": "くらもちの皇子の策略がばれたのはなぜですか。三十字以内で書きなさい。", "a": "<strong>にせ物を作った匠たちが、代金を求めて翁の家に来たから。</strong><br />策略の中身（にせの玉の枝を作らせたこと）と、ばれたきっかけ（匠たちの来訪）を結びつけて書きます。理由を問う問題なので、文末は「〜から。」で終えます。"}, {"id": 18, "cat": "記述", "q": "帝が、かぐや姫が残した不死の薬を燃やさせたのはなぜだと考えられますか。四十字以内で書きなさい。", "a": "<strong>かぐや姫のいない世界で、永遠に生きても意味がないと考えたから。</strong><br />本文に直接書かれていない気持ちを問う問題です。「姫がいないのに、自分だけ不死の薬で生き続けても仕方がない」という帝の気持ちを、現代語でまとめます。"}, {"id": 19, "cat": "記述", "q": "「ふじの山」という名前の由来を、二十字以内で書きなさい。", "a": "<strong>士に富む山という意味で名付けられたから。</strong><br />使者が兵士（士）たちをたくさん引き連れて登ったことから、「士に富む山」→「ふじの山」となりました。字数が短いので、「士に富む」が大事な部分です。"}, {"id": 20, "cat": "歴史的仮名遣い", "q": "「答へて」を現代仮名遣いに直したものとして正しいものを選びなさい。<br />ア こたへて　イ こたえて　ウ こたあて　エ こたいて", "a": "<strong>イ</strong><br />「へ」は語頭以外なので「え」に直します。「答へて」→「こたえて」となります。"}, {"id": 21, "cat": "歴史的仮名遣い", "q": "「くわし」の、現代の読み方として正しいものを選びなさい。<br />ア かし　イ くわし　ウ がし　エ くあし", "a": "<strong>ア</strong><br />「くわ」は「か」に直します。「くわし」は「かし（菓子）」と読みます。"}, {"id": 22, "cat": "古語の意味", "q": "古語「なむ」の意味として正しいものを選びなさい。<br />ア 〜です・〜である（丁寧に断定する）　イ 〜た（過去）　ウ 〜なさい（命令）　エ 〜だろう（推量）", "a": "<strong>ア</strong><br />「なむ」は、文を丁寧に言い切る働きをします。「竹なむ一筋ありける」は「竹が一筋あった」という意味です。"}, {"id": 23, "cat": "古語の意味", "q": "古語「あやしがりて」の意味として正しいものを選びなさい。<br />ア 不思議に思って　イ 怒って　ウ 眠くなって　エ 喜んで", "a": "<strong>ア</strong><br />「あやし」は「不思議だ」という意味です。翁が光る竹を「あやしがりて」近寄った場面で使われます。"}, {"id": 24, "cat": "内容理解", "q": "石作の皇子に出された難題として正しいものを選びなさい。<br />ア 蓬莱の玉の枝　イ 仏の御石の鉢　ウ 燕の子安貝　エ 火鼠の皮衣", "a": "<strong>イ</strong><br />石作の皇子は「仏の御石の鉢」です。くらもちの皇子は蓬莱の玉の枝、右大臣阿部御主人は火鼠の皮衣、大納言大伴御行は龍の首の珠、中納言石上麿足は燕の子安貝です。"}, {"id": 25, "cat": "内容理解", "q": "かぐや姫が、求婚してきた貴公子たち一人ずつに難題を出した理由として最も適切なものを選びなさい。<br />ア 珍しい宝物を集めたかったから　イ 求婚を断り切れず、難題によって結婚を諦めさせるため　ウ 竹取の翁に強く勧められたから　エ 貴公子たちの力を試す遊びのため", "a": "<strong>イ</strong><br />かぐや姫は結婚する気がなかったため、手に入れることが難しい宝物を言い、相手に諦めさせようとしました。これが五人の貴公子への難題の理由です。"}, {"id": 26, "cat": "内容理解", "q": "かぐや姫が、月を見てはなげき悲しんでいた理由として正しいものを選びなさい。<br />ア 地上の暮らしが退屈だったから　イ 自分が月の都の者で、やがて迎えが来て月へ帰らなければならないから　ウ 帝に会うのが嫌だったから　エ 翁とけんかをしたから", "a": "<strong>イ</strong><br />かぐや姫はもともと月の都の者で、中秋の名月の夜に迎えが来ることが分かっていたため、月を見てなげき悲しんでいました。"}];
var GROUP_HEADS = {};
var DRAW = 26;
var MPAGE="quiz_chu1_finals_japanese_hourai.html", MTITLE="中1国語 読解予想問題 蓬莱の玉の枝（竹取物語）", MCHILD="sakuya", MN=QUESTIONS.length;
var KEY='stepup-mistakes-'+MCHILD;
function todayStr(){var d=new Date();var m=('0'+(d.getMonth()+1)).slice(-2);var day=('0'+d.getDate()).slice(-2);return d.getFullYear()+'-'+m+'-'+day;}
function load(){try{var v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)?v:[];}catch(e){return[];}}
function saveAll(a){localStorage.setItem(KEY,JSON.stringify(a));}
function findIdx(a,q){for(var i=0;i<a.length;i++){if(a[i].page===MPAGE&&a[i].q===q)return i;}return -1;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
(function(){
  var units=[], byG={}, i, k, it;
  for(i=0;i<QUESTIONS.length;i++){it=QUESTIONS[i];
    if(it.g){if(!byG[it.g]){byG[it.g]=[];units.push(byG[it.g]);}byG[it.g].push(it);}
    else{units.push([it]);}
  }
  shuffle(units);
  var flat=[];
  for(i=0;i<units.length;i++){for(k=0;k<units[i].length;k++){flat.push(units[i][k]);}}
  var picked=flat.slice(0,Math.min(DRAW,flat.length));
  var area=document.getElementById('quizArea');
  function refreshBadges(){
    var recs=load();
    var spans=area.querySelectorAll('[data-rec]');
    for(var s=0;s<spans.length;s++){
      var id=parseInt(spans[s].getAttribute('data-rec'),10);
      var idx=findIdx(recs,id);
      spans[s].textContent=(idx>=0)?('記録済み×'+recs[idx].count):'';
    }
  }
  var seenG={};
  for(i=0;i<picked.length;i++){
    it=picked[i];
    if(it.g&&GROUP_HEADS[it.g]&&!seenG[it.g]){
      seenG[it.g]=1;
      var ph=document.createElement('div');ph.className='passage';ph.innerHTML=GROUP_HEADS[it.g];
      area.appendChild(ph);
    }
    var card=document.createElement('div');card.className='qcard';
    var head=document.createElement('div');head.className='qhead';
    var num=document.createElement('span');num.className='qnum';num.textContent='問'+(i+1);
    var cat=document.createElement('span');cat.className='qcat';cat.textContent=it.cat;
    head.appendChild(num);head.appendChild(cat);
    var body=document.createElement('div');body.className='qbody';body.innerHTML=it.q;
    var btn=document.createElement('button');btn.type='button';btn.className='abtn';btn.textContent='答えを見る';
    var box=document.createElement('div');box.className='abox';box.innerHTML=it.a;
    (function(box,btn){btn.addEventListener('click',function(){
      if(box.className.indexOf('open')>=0){box.className='abox';btn.textContent='答えを見る';}
      else{box.className='abox open';btn.textContent='答えを閉じる';}
    });})(box,btn);
    var mrow=document.createElement('div');mrow.className='mrow';
    var lab=document.createElement('label');
    var cb=document.createElement('input');cb.type='checkbox';cb.className='mcheck';cb.value=it.id;
    lab.appendChild(cb);lab.appendChild(document.createTextNode('まちがえた'));
    var rec=document.createElement('span');rec.className='rec';rec.setAttribute('data-rec',it.id);
    mrow.appendChild(lab);mrow.appendChild(rec);
    card.appendChild(head);card.appendChild(body);card.appendChild(btn);card.appendChild(box);card.appendChild(mrow);
    area.appendChild(card);
  }
  refreshBadges();
  document.getElementById('mpSave').addEventListener('click',function(){
    var cbs=area.querySelectorAll('input.mcheck:checked');
    var msg=document.getElementById('mpMsg');
    if(cbs.length===0){msg.textContent='チェックが入っていません。まちがえた問題を選んでください。';return;}
    var a=load();var t=todayStr();
    for(var i2=0;i2<cbs.length;i2++){
      var q=parseInt(cbs[i2].value,10);var idx=findIdx(a,q);
      if(idx>=0){a[idx].count+=1;a[idx].last=t;}
      else{a.push({page:MPAGE,title:MTITLE,q:q,count:1,first:t,last:t});}
    }
    saveAll(a);
    for(var i3=0;i3<cbs.length;i3++){cbs[i3].checked=false;}
    refreshBadges();
    msg.textContent=cbs.length+'件を記録しました。まちがい復習ページで待っています。';
  });
})();
</script>
