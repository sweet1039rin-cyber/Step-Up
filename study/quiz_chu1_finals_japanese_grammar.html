<h1>中1国語 文法問題集｜文の組み立て（国語の学習P94〜97）</h1>
<p>※国語の学習P94〜97「文の組み立て」の出題形式で作った類題です。全30問をシャッフルして出題します。文の成分（主語・述語・修飾語・接続語・独立語）と、文節どうしの関係を確かめましょう。</p>
<p class="randinfo">🎲 全30問をシャッフルして出しています。もう一度開くと順番が変わります。</p>
<hr />
<div id="quizArea"></div>

<section class="mpanel" id="mistakePanel">
<h2>✍️ まちがい記録</h2>
<p>まちがえた問題の「まちがえた」にチェックを入れて「記録する」を押すと、まちがい復習ボックスに残ります。あとで復習ページに出てきます。</p>
<button type="button" class="mbtn" id="mpSave">記録する</button>
<p class="mmsg" id="mpMsg"></p>
</section>

<script>
var QUESTIONS = [{"id": 1, "cat": "主語・述語", "q": "次の文の主語を書き抜きなさい。「猫が　庭で　眠っている。」", "a": "<strong>猫が</strong><br />「何が」に当たる文節が主語です。"}, {"id": 2, "cat": "主語・述語", "q": "次の文の述語を書き抜きなさい。「空が　とても　青い。」", "a": "<strong>青い</strong><br />「どんなだ」に当たる文節が述語です。"}, {"id": 3, "cat": "主語・述語", "q": "次の文の述語を書き抜きなさい。「兄は　駅まで　走った。」", "a": "<strong>走った</strong><br />「どうする」に当たる文節が述語です。"}, {"id": 4, "cat": "主語・述語", "q": "次の文の主語を書き抜きなさい。「その本は　私の　ものです。」", "a": "<strong>その本は</strong><br />主語は、生き物とは限りません。「何が」に当たる文節を探します。"}, {"id": 5, "cat": "主語・述語", "q": "次の文の主語と述語の組み合わせとして正しいものを選びなさい。「弟が　公園で　ボールを　投げた。」<br />ア 弟が―投げた　イ 公園で―投げた　ウ ボールを―弟が　エ 投げた―公園で", "a": "<strong>ア</strong><br />「何が―どうする」の結び付きが主語と述語です。"}, {"id": 6, "cat": "主語・述語", "q": "次の文の主語として正しいものを選びなさい。「妹が　作った　ケーキは　とても　おいしい。」<br />ア 妹が　イ ケーキは　ウ 作った　エ おいしい", "a": "<strong>イ</strong><br />「妹が作った」は「ケーキは」を修飾しています。文全体の主語は「ケーキは」です。"}, {"id": 7, "cat": "修飾語", "q": "次の文で、「ゆっくり」が修飾している文節を書き抜きなさい。「祖母は　ゆっくり　歩く。」", "a": "<strong>歩く</strong><br />「どのように」に当たる連用修飾語は、述語を修飾します。"}, {"id": 8, "cat": "修飾語", "q": "次の文で、「大きな」が修飾している文節を書き抜きなさい。「大きな　犬が　ほえる。」", "a": "<strong>犬が</strong><br />「どのような」に当たる連体修飾語は、体言を含む文節を修飾します。"}, {"id": 9, "cat": "修飾語", "q": "次の文で、「早く」が修飾している文節を書き抜きなさい。「兄は　毎朝　早く　起きる。」", "a": "<strong>起きる</strong><br />「早く」は起き方を説明しています。「毎朝」も「起きる」を修飾します。"}, {"id": 10, "cat": "修飾語", "q": "次の文で、「白い」が修飾している文節を書き抜きなさい。「白い　紙に　絵を　描く。」", "a": "<strong>紙に</strong><br />「白い」は「紙に」について説明しています。"}, {"id": 11, "cat": "修飾語", "q": "修飾語のない文を選びなさい。<br />ア 猫が　眠る　イ 大きな　猫が　眠る　ウ 猫が　ゆっくり　眠る　エ 猫が　庭で　眠る", "a": "<strong>ア</strong><br />イの「大きな」、ウの「ゆっくり」、エの「庭で」は修飾語です。アには修飾語がありません。"}, {"id": 12, "cat": "接続語・独立語", "q": "次の文の「だから」は、文の成分の何ですか。「ねむい。だから、もう寝よう。」<br />ア 主語　イ 述語　ウ 接続語　エ 独立語", "a": "<strong>ウ</strong><br />「だから」は文と文をつなぎ、理由を表す接続語です。"}, {"id": 13, "cat": "接続語・独立語", "q": "次の文の「ああ」は、文の成分の何ですか。「ああ、もう五時だ。」<br />ア 接続語　イ 独立語　ウ 修飾語　エ 主語", "a": "<strong>イ</strong><br />「ああ」は感動を表し、ほかの文節とは直接関係なく独立しています。"}, {"id": 14, "cat": "接続語・独立語", "q": "次の文の「でも」の働きとして正しいものを選びなさい。「疲れた。でも、がんばろう。」<br />ア 前後の文をつないでいる　イ 主語になっている　ウ 述語を修飾している　エ 呼びかけを表している", "a": "<strong>ア</strong><br />「でも」は前後の文をつなぐ接続語で、逆接の関係を表します。"}, {"id": 15, "cat": "接続語・独立語", "q": "次の文の「はい」は、文の成分の何ですか。「はい、私も行きます。」<br />ア 接続語　イ 独立語　ウ 主語　エ 修飾語", "a": "<strong>イ</strong><br />「はい」は応答を表す独立語です。"}, {"id": 16, "cat": "連文節の働き", "q": "次の文の連文節「話している」は、文の中でどのような働きをしていますか。「妹は　友達と　話して　いる。」<br />ア 主部　イ 述部　ウ 修飾部　エ 独立部", "a": "<strong>イ</strong><br />連文節「話している」は、文全体の述語の働き（述部）をしています。"}, {"id": 17, "cat": "連文節の働き", "q": "次の文の連文節「聞いていた」は、文の中でどのような働きをしていますか。「聞いて　いた　話と　違う。」<br />ア 主部　イ 述部　ウ 修飾部　エ 接続部", "a": "<strong>ウ</strong><br />連文節「聞いていた」は「話」を修飾しているので、修飾部の働きです。連文節の中の中心になる文節の意味を考えます。"}, {"id": 18, "cat": "文節どうしの関係", "q": "次の文の「パンと」と「ごはんを」の文節どうしの関係として正しいものを選びなさい。「パンと　ごはんを　食べる。」<br />ア 主・述の関係　イ 並立の関係　ウ 補助の関係　エ 接続の関係", "a": "<strong>イ</strong><br />二つの文節が対等の関係で並んでいるので、並立の関係です。"}, {"id": 19, "cat": "文節どうしの関係", "q": "次の文の「試して」と「みる」の文節どうしの関係として正しいものを選びなさい。「試して　みる。」<br />ア 並立の関係　イ 接続の関係　ウ 補助の関係　エ 独立の関係", "a": "<strong>ウ</strong><br />主な意味を表す文節の後に、意味を補う文節が付く補助の関係です。"}, {"id": 20, "cat": "文節どうしの関係", "q": "次の文の「疲れたので」と「休む」の文節どうしの関係として正しいものを選びなさい。「疲れたので、休む。」<br />ア 修飾・被修飾の関係　イ 接続の関係　ウ 並立の関係　エ 独立の関係", "a": "<strong>イ</strong><br />「…ので」が後に続く文節に対する理由を表す、接続の関係です。"}, {"id": 21, "cat": "主語・述語", "q": "次の文の主語を書き抜きなさい。「雨が　窓を　打つ。」", "a": "<strong>雨が</strong><br />「何が　どうする」の「何が」に当たる文節が主語です。"}, {"id": 22, "cat": "主語・述語", "q": "次の文の述語を書き抜きなさい。「この歌は　とても　有名だ。」", "a": "<strong>有名だ</strong><br />「何だ」に当たる文節が述語です。「とても」は「有名だ」を修飾しています。"}, {"id": 23, "cat": "主語・述語", "q": "次の文の主語と述語の組み合わせとして正しいものを選びなさい。「鳥が　空を　飛ぶ。」<br />ア 鳥が―飛ぶ　イ 空を―飛ぶ　ウ 鳥が―空を　エ 飛ぶ―空を", "a": "<strong>ア</strong><br />「何が―どうする」の結び付きを探します。「空を」は「飛ぶ」を修飾しています。"}, {"id": 24, "cat": "修飾語", "q": "次の文で、「静かに」が修飾している文節を書き抜きなさい。「妹は　静かに　本を　読む。」", "a": "<strong>読む</strong><br />「どのように」に当たる連用修飾語は、述語「読む」を修飾します。"}, {"id": 25, "cat": "修飾語", "q": "次の文で、「赤い」が修飾している文節を書き抜きなさい。「赤い　車が　止まる。」", "a": "<strong>車が</strong><br />「どのような」に当たる連体修飾語は、体言を含む文節を修飾します。"}, {"id": 26, "cat": "修飾語", "q": "修飾語のない文を選びなさい。<br />ア 犬が　走る　イ 犬が　速く　走る　ウ 白い　犬が　走る　エ 犬が　庭で　走る", "a": "<strong>ア</strong><br />イの「速く」、ウの「白い」、エの「庭で」は修飾語です。アには修飾語がありません。"}, {"id": 27, "cat": "接続語・独立語", "q": "次の文の「しかし」は、文の成分の何ですか。「雨が降ってきた。しかし、試合は続いた。」<br />ア 主語　イ 述語　ウ 接続語　エ 独立語", "a": "<strong>ウ</strong><br />「しかし」は前後の文をつなぎ、逆接の関係を表す接続語です。"}, {"id": 28, "cat": "接続語・独立語", "q": "次の文の「さあ」は、文の成分の何ですか。「さあ、出発しよう。」<br />ア 接続語　イ 独立語　ウ 修飾語　エ 主語", "a": "<strong>イ</strong><br />「さあ」は呼びかけを表し、ほかの文節とは直接関係なく独立しています。"}, {"id": 29, "cat": "文節どうしの関係", "q": "次の文の「本と」と「ノートを」の文節どうしの関係として正しいものを選びなさい。「本と　ノートを　買う。」<br />ア 主・述の関係　イ 並立の関係　ウ 補助の関係　エ 接続の関係", "a": "<strong>イ</strong><br />二つの文節が対等の関係で並んでいるので、並立の関係です。"}, {"id": 30, "cat": "文節どうしの関係", "q": "次の文の「置いて」と「ある」の文節どうしの関係として正しいものを選びなさい。「机の上に　置いて　ある。」<br />ア 並立の関係　イ 接続の関係　ウ 補助の関係　エ 独立の関係", "a": "<strong>ウ</strong><br />「ある」が「置いて」の意味を補っている、補助の関係です。"}];
var GROUP_HEADS = {};
var DRAW = 30;
var MPAGE="quiz_chu1_finals_japanese_grammar.html", MTITLE="中1国語 文法問題集｜文の組み立て（国語の学習P94〜97）", MCHILD="sakuya", MN=QUESTIONS.length;
var KEY='stepup-mistakes-'+MCHILD;
function todayStr(){var d=new Date();var m=('0'+(d.getMonth()+1)).slice(-2);var day=('0'+d.getDate()).slice(-2);return d.getFullYear()+'-'+m+'-'+day;}
function load(){try{var v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)?v:[];}catch(e){return[];}}
function saveAll(a){localStorage.setItem(KEY,JSON.stringify(a));}
function findIdx(a,q){for(var i=0;i<a.length;i++){if(a[i].page===MPAGE&&a[i].q===q)return i;}return -1;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
(function(){
  var units=[], byG={}, i, k, it;
  for(i=0;i<QUESTIONS.length;i++){it=QUESTIONS[i];
    if(it.g){if(!byG[it.g]){byG[it.g]=[];units.push(byG[it.g]);}byG[it.g].push(it);}
    else{units.push([it]);}
  }
  shuffle(units);
  var flat=[];
  for(i=0;i<units.length;i++){for(k=0;k<units[i].length;k++){flat.push(units[i][k]);}}
  var picked=flat.slice(0,Math.min(DRAW,flat.length));
  var area=document.getElementById('quizArea');
  function refreshBadges(){
    var recs=load();
    var spans=area.querySelectorAll('[data-rec]');
    for(var s=0;s<spans.length;s++){
      var id=parseInt(spans[s].getAttribute('data-rec'),10);
      var idx=findIdx(recs,id);
      spans[s].textContent=(idx>=0)?('記録済み×'+recs[idx].count):'';
    }
  }
  var seenG={};
  for(i=0;i<picked.length;i++){
    it=picked[i];
    if(it.g&&GROUP_HEADS[it.g]&&!seenG[it.g]){
      seenG[it.g]=1;
      var ph=document.createElement('div');ph.className='passage';ph.innerHTML=GROUP_HEADS[it.g];
      area.appendChild(ph);
    }
    var card=document.createElement('div');card.className='qcard';
    var head=document.createElement('div');head.className='qhead';
    var num=document.createElement('span');num.className='qnum';num.textContent='問'+(i+1);
    var cat=document.createElement('span');cat.className='qcat';cat.textContent=it.cat;
    head.appendChild(num);head.appendChild(cat);
    var body=document.createElement('div');body.className='qbody';body.innerHTML=it.q;
    var btn=document.createElement('button');btn.type='button';btn.className='abtn';btn.textContent='答えを見る';
    var box=document.createElement('div');box.className='abox';box.innerHTML=it.a;
    (function(box,btn){btn.addEventListener('click',function(){
      if(box.className.indexOf('open')>=0){box.className='abox';btn.textContent='答えを見る';}
      else{box.className='abox open';btn.textContent='答えを閉じる';}
    });})(box,btn);
    var mrow=document.createElement('div');mrow.className='mrow';
    var lab=document.createElement('label');
    var cb=document.createElement('input');cb.type='checkbox';cb.className='mcheck';cb.value=it.id;
    lab.appendChild(cb);lab.appendChild(document.createTextNode('まちがえた'));
    var rec=document.createElement('span');rec.className='rec';rec.setAttribute('data-rec',it.id);
    mrow.appendChild(lab);mrow.appendChild(rec);
    card.appendChild(head);card.appendChild(body);card.appendChild(btn);card.appendChild(box);card.appendChild(mrow);
    area.appendChild(card);
  }
  refreshBadges();
  document.getElementById('mpSave').addEventListener('click',function(){
    var cbs=area.querySelectorAll('input.mcheck:checked');
    var msg=document.getElementById('mpMsg');
    if(cbs.length===0){msg.textContent='チェックが入っていません。まちがえた問題を選んでください。';return;}
    var a=load();var t=todayStr();
    for(var i2=0;i2<cbs.length;i2++){
      var q=parseInt(cbs[i2].value,10);var idx=findIdx(a,q);
      if(idx>=0){a[idx].count+=1;a[idx].last=t;}
      else{a.push({page:MPAGE,title:MTITLE,q:q,count:1,first:t,last:t});}
    }
    saveAll(a);
    for(var i3=0;i3<cbs.length;i3++){cbs[i3].checked=false;}
    refreshBadges();
    msg.textContent=cbs.length+'件を記録しました。まちがい復習ページで待っています。';
  });
})();
</script>
