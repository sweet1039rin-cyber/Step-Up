<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中3理科 一問一答｜運動とエネルギー｜Step Up テスト対策</title>
<style>
:root{--ink:#1c2733;--accent:#ff6b9d;--navy:#1a1a5e;--line:#d9e2ec;--soft:#f4f7fb}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);
 font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
 font-size:18px;line-height:1.85;-webkit-text-size-adjust:100%}
.wrap{max-width:880px;margin:0 auto;padding:20px 18px 56px}
h1{font-size:1.55rem;line-height:1.45;border-bottom:4px solid var(--accent);padding-bottom:.35em;margin:.4em 0 .8em}
p{margin:.6em 0}
.backlink{display:inline-block;margin-top:28px;background:var(--accent);color:#fff;font-weight:700;
 text-decoration:none;padding:14px 22px;border-radius:999px;font-size:1.05rem}
.toplink{font-size:.95rem;margin-bottom:4px}
.toplink a{color:var(--navy)}
footer{margin-top:10px}
@media (max-width:600px){body{font-size:17px}.wrap{padding:14px 12px 48px}h1{font-size:1.35rem}}
.progress-text{font-weight:700;margin:16px 0 6px;font-size:1.1rem}
.progress-bar{height:16px;background:var(--soft);border:2px solid var(--line);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);width:0;transition:width .3s}
.qbox{border:3px solid var(--navy);border-radius:18px;padding:26px 20px;margin:20px 0 6px;background:#fff;text-align:center}
.qbox-label{font-size:.85rem;font-weight:700;color:var(--accent);letter-spacing:.2em;margin-bottom:12px}
.qbox-label.ans{color:var(--navy)}
.qbox-text{font-size:1.3rem;font-weight:700;line-height:1.65}
.abox{border:3px solid var(--accent);border-radius:18px;padding:26px 20px;margin:14px 0 6px;background:var(--soft);text-align:center}
.abox-note{margin-top:14px;font-size:.98rem;color:#54677a;line-height:1.65}
.showbtn{display:block;width:100%;font-family:inherit;font-size:1.25rem;font-weight:700;padding:18px 10px;border-radius:14px;
 border:3px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer;min-height:64px;margin-top:16px}
.showbtn:active{transform:scale(.98)}
.judge{display:flex;gap:12px;margin-top:16px}
.jbtn{flex:1;font-family:inherit;font-size:1.25rem;font-weight:700;padding:18px 10px;border-radius:14px;
 border:3px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer;min-height:64px}
.jbtn.known{background:var(--accent);border-color:var(--accent);color:#fff}
.jbtn:active{transform:scale(.98)}
.done-box{border:3px solid var(--accent);border-radius:18px;padding:32px 20px;text-align:center;background:#fff5f8;margin-top:22px}
.done-title{font-size:1.5rem;font-weight:700;color:#c2255c;margin:.2em 0}
.done-score{font-size:1.3rem;font-weight:700;color:var(--navy)}
.restart{max-width:340px;margin:16px auto 0;display:block;width:100%}
.retry{max-width:340px;margin:16px auto 0;display:block;width:100%;background:var(--navy);border-color:var(--navy);color:#fff}
</style>
</head>
<body>
<div class="wrap">
<p class="toplink"><a href="iori.html">← 中3トップへ戻る</a></p>
<h1>中3理科 一問一答｜運動とエネルギー</h1>
<p>1問ずつ出ます。まず頭の中で答えてから「答えを見る」を押して、「できた」「できなかった」で教えてください。できなかった問題は、まちがい復習ボックスに残ります。</p>
<div class="progress-text" id="progressText"></div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div id="playArea">
<div class="qbox"><div class="qbox-label">も　ん　だ　い</div><div class="qbox-text" id="qText"></div></div>
<button class="showbtn" id="btnShow" type="button">答えを見る</button>
<div class="abox" id="answerArea" style="display:none"><div class="qbox-label ans">こ　た　え</div><div class="qbox-text" id="aText"></div><div class="abox-note" id="aNote"></div></div>
<div class="judge" id="judgeBtns" style="visibility:hidden">
<button class="jbtn still" id="btnNg" type="button">できなかった</button>
<button class="jbtn known" id="btnOk" type="button">できた</button>
</div>
</div>
<div id="doneArea" style="display:none">
<div class="done-box"><p class="done-title" id="doneTitle">🎉 おつかれさま！</p><p class="done-score" id="doneText"></p>
<button class="jbtn known retry" id="btnRetry" type="button" style="display:none">できなかった問題だけもう一度</button>
<button class="jbtn known restart" id="btnRestart" type="button">最初からもう一度</button></div>
</div>
<footer><a class="backlink" href="iori.html">← 中3トップへ戻る</a> <a class="backlink" href="../index.html" style="background:#1a1a5e">🏠 アプリへ戻る</a></footer>
</div>
<script>
var CARDS = [
 {
  "q": "速さの公式は？",
  "a": "速さ ＝ 距離 ÷ 時間",
  "n": "単位をそろえてから計算します"
 },
 {
  "q": "距離の求め方は？",
  "a": "距離 ＝ 速さ × 時間",
  "n": ""
 },
 {
  "q": "慣性とは？",
  "a": "力がはたらかないとき、物体が今の運動の状態を続けようとすることです",
  "n": "止まっているものは止まったまま、動いているものは同じ速さでまっすぐ進みます"
 },
 {
  "q": "摩擦力とは？",
  "a": "動きと反対向きにはたらく力です",
  "n": "台車がやがて止まるのは摩擦力のせいです"
 },
 {
  "q": "進行方向に力を加え続けると、物体はどうなる？",
  "a": "だんだん速くなります",
  "n": ""
 },
 {
  "q": "仕事の公式は？",
  "a": "仕事（J）＝ 力（N）× 距離（m）",
  "n": ""
 },
 {
  "q": "仕事率の公式は？",
  "a": "仕事率（W）＝ 仕事（J）÷ 時間（秒）",
  "n": "時間は「分」や「時間」のまま使わず、秒に直します"
 },
 {
  "q": "物を持っているだけ・押しても動かないとき、仕事は？",
  "a": "0 です",
  "n": "理科の仕事は、力を加えてその向きに動かしたときだけです"
 },
 {
  "q": "100gの物体にはたらく重力は、約何N？",
  "a": "約1N",
  "n": "1kgなら約10Nです。仕事の計算で換算し忘れに注意"
 },
 {
  "q": "仕事の原理とは？",
  "a": "道具を使っても、仕事の量は減らないことです",
  "n": "力で得をすると、距離で損をします"
 },
 {
  "q": "動滑車を使うと、力と引く距離はどうなる？",
  "a": "力は 1/2 になり、引く距離は 2倍になります",
  "n": "仕事の量は同じです"
 },
 {
  "q": "仕事率が大きいのは、どんなとき？",
  "a": "同じ仕事を短時間で終えたときです",
  "n": "仕事率は「1秒あたりの仕事」です"
 },
 {
  "q": "位置エネルギーは、何で決まる？",
  "a": "質量と高さです（重いほど・高いほど大きい）",
  "n": ""
 },
 {
  "q": "運動エネルギーは、何で決まる？",
  "a": "質量と速さです",
  "n": "速さが2倍になると、運動エネルギーは4倍になります"
 },
 {
  "q": "力学的エネルギーとは？",
  "a": "位置エネルギー ＋ 運動エネルギー の合計です",
  "n": ""
 },
 {
  "q": "力学的エネルギーの保存とは？",
  "a": "摩擦や空気の抵抗がないとき、力学的エネルギーの合計は一定に保たれることです",
  "n": "位置エネルギーが減った分だけ、運動エネルギーが増えます"
 },
 {
  "q": "ふりこで運動エネルギーが最大になるのは、どこ？",
  "a": "一番下の位置です",
  "n": "一番高い所では位置エネルギーが最大です"
 },
 {
  "q": "速さの計算で「秒速○m」のとき、使う単位は？",
  "a": "距離は m、時間は 秒 です",
  "n": "単位をそろえるのが計算の第一歩です"
 }
];
var MPAGE="ichimon_chu3_science.html", MTITLE="中3理科 一問一答｜運動とエネルギー", MCHILD="iori";
var MKEY='stepup-mistakes-'+MCHILD;
var total = CARDS.length;
var deck = [];
var pos = 0;
var revealed = false;
var roundOk = 0;
var missed = [];
var isFullRound = true;
function el(id){ return document.getElementById(id); }
function todayStr(d){d=d||new Date();var m=('0'+(d.getMonth()+1)).slice(-2);var day=('0'+d.getDate()).slice(-2);return d.getFullYear()+'-'+m+'-'+day;}
function loadMistakes(){try{var v=JSON.parse(localStorage.getItem(MKEY));return Array.isArray(v)?v:[];}catch(e){return[];}}
function saveMistake(q){
  var a=loadMistakes();var t=todayStr();var idx=-1;
  for(var i=0;i<a.length;i++){if(a[i].page===MPAGE&&a[i].q===q){idx=i;break;}}
  if(idx>=0){a[idx].count+=1;a[idx].last=t;}
  else{a.push({page:MPAGE,title:MTITLE,q:q,count:1,first:t,last:t});}
  try{localStorage.setItem(MKEY,JSON.stringify(a));}catch(e){}
}
function updateProgress(){
  el('progressText').textContent = (pos+1) + '問目 / 全' + deck.length + '問　できた ' + roundOk + '問';
  el('progressFill').style.width = (deck.length ? (pos/deck.length*100) : 0) + '%';
}
function showQuestion(){
  revealed = false;
  var c = CARDS[deck[pos]];
  el('qText').textContent = c.q;
  el('aText').textContent = c.a;
  el('aNote').textContent = c.n || '';
  el('answerArea').style.display = 'none';
  el('btnShow').style.display = 'block';
  el('judgeBtns').style.visibility = 'hidden';
  updateProgress();
}
function startRound(indices, full){
  deck = indices.slice(); pos = 0; roundOk = 0; missed = []; isFullRound = full;
  el('doneArea').style.display = 'none';
  el('playArea').style.display = 'block';
  showQuestion();
}
function init(){
  var all = CARDS.map(function(_, i){ return i; });
  startRound(all, true);
}
function finish(){
  if(isFullRound){ coinAward(10,'一問一答1周','ichimon:ichimon_chu3_science',1); }
  el('playArea').style.display = 'none';
  el('doneArea').style.display = 'block';
  el('progressText').textContent = 'できた ' + roundOk + ' / ' + deck.length + ' 問';
  el('progressFill').style.width = '100%';
  if(missed.length === 0){
    el('doneTitle').textContent = '🎉 全問できた！';
    el('doneText').textContent = '全' + deck.length + '問、全部できました。おつかれさま！';
    el('btnRetry').style.display = 'none';
  } else {
    el('doneTitle').textContent = 'おつかれさま！';
    el('doneText').textContent = deck.length + '問中 ' + roundOk + '問できました。できなかった' + missed.length + '問は、まちがい復習ボックスに残しました。';
    el('btnRetry').style.display = 'block';
  }
}
function judge(ok){
  if(!revealed) return;
  var origIdx = deck[pos];
  if(ok){ roundOk++; coinAward(1,'一問一答','ichimon-science',20); }
  else { missed.push(origIdx); saveMistake(origIdx + 1); }
  pos++;
  if(pos >= deck.length){ finish(); return; }
  showQuestion();
}
el('btnShow').addEventListener('click', function(){
  if(revealed) return;
  revealed = true;
  el('answerArea').style.display = 'block';
  el('btnShow').style.display = 'none';
  el('judgeBtns').style.visibility = 'visible';
});
el('btnOk').addEventListener('click', function(){ judge(true); });
el('btnNg').addEventListener('click', function(){ judge(false); });
el('btnRetry').addEventListener('click', function(){ startRound(missed, false); });
el('btnRestart').addEventListener('click', init);
init();
/* ==== ご褒美コイン ==== */
var COIN_CHILD='iori';
var COIN_KEY='stepup-coins-'+COIN_CHILD;
var CLAIM_KEY='stepup-coinclaims-'+COIN_CHILD;
function coinLoad(){try{var v=JSON.parse(localStorage.getItem(COIN_KEY));if(v&&typeof v.total==='number'&&Array.isArray(v.history))return v;}catch(e){}return{total:0,history:[]};}
function coinClaimsLoad(){try{var v=JSON.parse(localStorage.getItem(CLAIM_KEY));if(v&&typeof v==='object'&&v!==null)return v;}catch(e){}return{};}
function coinAward(amount,sourceLabel,claimId,dailyCap){
  if(!amount||amount<=0)return 0;
  if(dailyCap==null)dailyCap=1;
  if(claimId){
    var claims=coinClaimsLoad();
    var ck=todayStr()+':'+claimId;
    var n=claims[ck]||0;
    if(n>=dailyCap)return 0;
    claims[ck]=n+1;
    try{localStorage.setItem(CLAIM_KEY,JSON.stringify(claims));}catch(e){}
  }
  var data=coinLoad();
  data.total+=amount;
  data.history.push({date:todayStr(),source:sourceLabel,amount:amount});
  if(data.history.length>200)data.history=data.history.slice(data.history.length-200);
  try{localStorage.setItem(COIN_KEY,JSON.stringify(data));}catch(e){}
  coinToast(amount);
  return amount;
}
function coinToast(amount){
  var t=document.createElement('div');
  t.textContent='🪙 +'+amount+'コイン！';
  t.setAttribute('style','position:fixed;right:16px;bottom:16px;z-index:9999;background:#1a1a5e;color:#fff;font-weight:700;font-size:1.1rem;padding:12px 20px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .3s;pointer-events:none');
  document.body.appendChild(t);
  setTimeout(function(){t.style.opacity='1';},10);
  setTimeout(function(){t.style.opacity='0';},1700);
  setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},2200);
}
</script>
</body>
</html>
