<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>まちがい復習ボックス｜中3 壱凰 IORI｜Step Up テスト対策</title>
<style>
:root{--ink:#1c2733;--accent:#ff6b9d;--navy:#1a1a5e;--line:#d9e2ec;--soft:#f4f7fb}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);
 font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
 font-size:18px;line-height:1.85;-webkit-text-size-adjust:100%}
.wrap{max-width:880px;margin:0 auto;padding:20px 18px 56px}
h1{font-size:1.55rem;line-height:1.45;border-bottom:4px solid var(--accent);padding-bottom:.35em;margin:.4em 0 .8em}
h2{font-size:1.3rem;line-height:1.5;border-left:8px solid var(--accent);padding:.1em 0 .1em .5em;margin:1.4em 0 .6em;background:var(--soft)}
p{margin:.6em 0}
strong{color:#c2255c}
.backlink{display:inline-block;margin-top:28px;background:var(--accent);color:#fff;font-weight:700;
 text-decoration:none;padding:14px 22px;border-radius:999px;font-size:1.05rem}
.toplink{font-size:.95rem;margin-bottom:4px}
.toplink a{color:var(--navy)}
footer{margin-top:10px}
.bigbtn{display:block;width:100%;text-align:center;background:var(--navy);color:#fff;font-weight:700;
 border:none;border-radius:14px;padding:18px 14px;font-size:1.15rem;cursor:pointer;margin:.7em 0;text-decoration:none}
.bigbtn.pink{background:var(--accent)}
.bigbtn:disabled{background:#9aa7b4;cursor:default}
.subbtn{display:inline-block;background:#fff;color:var(--navy);font-weight:700;border:2px solid var(--navy);
 border-radius:999px;padding:10px 20px;font-size:1rem;cursor:pointer;text-decoration:none;margin:.2em .2em .2em 0}
.qbox{border:3px solid var(--navy);border-radius:14px;padding:20px 18px;margin:1em 0;background:#fff}
.qsubj{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 14px;font-size:.9rem;font-weight:700;color:var(--navy)}
.qtext{font-size:1.2rem;font-weight:700;margin:.6em 0}
.atext{border-top:2px dashed var(--line);margin-top:.8em;padding-top:.8em}
.judgerow{display:flex;gap:10px;margin-top:1em}
.judgerow button{flex:1;padding:16px 8px;font-size:1.1rem;font-weight:700;border-radius:12px;border:none;cursor:pointer}
.btn-ok{background:#1f9d66;color:#fff}
.btn-ng{background:#e8edf3;color:var(--ink);border:2px solid var(--line)}
.note{background:#fff7ea;border-left:6px solid #f2b134;border-radius:6px;padding:.6em 1em;margin:.8em 0}
.rowitem{border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:.6em 0;background:#fff}
.rowitem .meta{font-size:.88rem;color:#5a6b7d}
.duebox{border:3px solid #c2255c;border-radius:14px;padding:16px 18px;background:#fff5f8;margin:1em 0}
.score{font-size:2rem;font-weight:700;color:var(--navy);text-align:center}
.center{text-align:center}
.weekrow{display:flex;gap:6px;justify-content:center;margin:.6em 0}
.weekrow span{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;background:#fff}
.weekrow span.done{background:var(--accent);border-color:var(--accent);color:#fff}
.timedisp{font-size:4rem;font-weight:700;text-align:center;color:var(--navy);font-variant-numeric:tabular-nums;margin:.2em 0}
.progresswrap{background:var(--soft);border-radius:999px;height:22px;overflow:hidden;margin:.8em 0}
.progressbar{background:var(--accent);height:100%;width:0%}
.presetrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.presetrow button{padding:12px 20px;font-size:1.05rem;font-weight:700;border-radius:999px;border:2px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
.presetrow button.on{background:var(--navy);color:#fff}
.phaselabel{text-align:center;font-size:1.3rem;font-weight:700}
@media (max-width:600px){body{font-size:17px}.wrap{padding:14px 12px 48px}h1{font-size:1.35rem}h2{font-size:1.18rem}.timedisp{font-size:3rem}}
</style>
</head>
<body>
<div class="wrap">
<p class="toplink"><a href="iori.html">← 教材トップへ戻る</a></p>

<h1>まちがい復習ボックス｜中3 壱凰 IORI</h1>
<p>予想問題で「まちがい記録」に残した問題がここに集まります。記録してから1日以上たったものは「今日の復習」に出ます。解けたら「解けたので消す」で消しましょう。</p>
<div class="duebox" id="dueBox" style="display:none">
<h2 style="border:none;background:none;padding:0;margin:.1em 0 .4em;color:#c2255c">📌 今日の復習</h2>
<div id="dueList"></div>
</div>
<h2>記録した間違い</h2>
<div id="allList"></div>
<p id="emptyMsg" style="display:none">まだ記録がありません。予想問題の下にある「まちがい記録」で、まちがえた問題を記録してみよう。</p>
<script>

function todayStr(d){d=d||new Date();var m=('0'+(d.getMonth()+1)).slice(-2);var day=('0'+d.getDate()).slice(-2);return d.getFullYear()+'-'+m+'-'+day;}
function daysDiff(a,b){return Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/86400000);}
function loadArr(k){try{var v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:[];}catch(e){return[];}}

var CHILD='iori';
var KEY='stepup-mistakes-'+CHILD;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function render(){
  var a=loadArr(KEY);var today=todayStr();
  var due=a.filter(function(e){return daysDiff(today,e.last)>=1;});
  var dueBox=document.getElementById('dueBox'),dueList=document.getElementById('dueList'),allList=document.getElementById('allList');
  document.getElementById('emptyMsg').style.display=a.length===0?'block':'none';
  function row(e,idx){
    return '<div class="rowitem"><div>'+esc(e.title)+' <strong>問'+e.q+'</strong></div>'
      +'<div class="meta">まちがえた回数：'+e.count+'回　最後に記録：'+e.last+'</div>'
      +'<div style="margin-top:.4em"><a class="subbtn" href="'+e.page+'">元の問題を開く</a>'
      +'<button type="button" class="subbtn" data-del="'+idx+'">解けたので消す</button></div></div>';
  }
  if(due.length>0){dueBox.style.display='block';dueList.innerHTML=due.map(function(e){return row(e,a.indexOf(e));}).join('');}
  else{dueBox.style.display='none';dueList.innerHTML='';}
  allList.innerHTML=a.map(function(e,i){return row(e,i);}).join('');
  var btns=allList.querySelectorAll('[data-del]'),btns2=dueList.querySelectorAll('[data-del]');
  function bind(list){for(var i=0;i<list.length;i++){(function(btn){btn.addEventListener('click',function(){
    var arr=loadArr(KEY);arr.splice(parseInt(btn.getAttribute('data-del'),10),1);
    localStorage.setItem(KEY,JSON.stringify(arr));coinAward(5,'まちがい直し','mistakes',5);render();
  });})(list[i]);}}
  bind(btns);bind(btns2);
}
render();
/* ==== ご褒美コイン ==== */
var COIN_CHILD='iori';
var COIN_KEY='stepup-coins-'+COIN_CHILD;
var CLAIM_KEY='stepup-coinclaims-'+COIN_CHILD;
function coinLoad(){try{var v=JSON.parse(localStorage.getItem(COIN_KEY));if(v&&typeof v.total==='number'&&Array.isArray(v.history))return v;}catch(e){}return{total:0,history:[]};}
function coinClaimsLoad(){try{var v=JSON.parse(localStorage.getItem(CLAIM_KEY));if(v&&typeof v==='object'&&v!==null)return v;}catch(e){}return{};}
function coinAward(amount,sourceLabel,claimId,dailyCap){
  if(!amount||amount<=0)return 0;
  if(dailyCap==null)dailyCap=1;
  if(claimId){
    var claims=coinClaimsLoad();
    var ck=todayStr()+':'+claimId;
    var n=claims[ck]||0;
    if(n>=dailyCap)return 0;
    claims[ck]=n+1;
    try{localStorage.setItem(CLAIM_KEY,JSON.stringify(claims));}catch(e){}
  }
  var data=coinLoad();
  data.total+=amount;
  data.history.push({date:todayStr(),source:sourceLabel,amount:amount});
  if(data.history.length>200)data.history=data.history.slice(data.history.length-200);
  try{localStorage.setItem(COIN_KEY,JSON.stringify(data));}catch(e){}
  coinToast(amount);
  return amount;
}
function coinToast(amount){
  var t=document.createElement('div');
  t.textContent='🪙 +'+amount+'コイン！';
  t.setAttribute('style','position:fixed;right:16px;bottom:16px;z-index:9999;background:#1a1a5e;color:#fff;font-weight:700;font-size:1.1rem;padding:12px 20px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .3s;pointer-events:none');
  document.body.appendChild(t);
  setTimeout(function(){t.style.opacity='1';},10);
  setTimeout(function(){t.style.opacity='0';},1700);
  setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},2200);
}
</script>

<footer><a class="backlink" href="iori.html">← 教材トップへ戻る</a></footer>
</div>
</body>
</html>
