<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中3国語 暗記カード｜文法と敬語｜Step Up テスト対策</title>
<style>
:root{--ink:#1c2733;--accent:#ff6b9d;--navy:#1a1a5e;--line:#d9e2ec;--soft:#f4f7fb}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);
 font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
 font-size:18px;line-height:1.85;-webkit-text-size-adjust:100%}
.wrap{max-width:880px;margin:0 auto;padding:20px 18px 56px}
h1{font-size:1.55rem;line-height:1.45;border-bottom:4px solid var(--accent);padding-bottom:.35em;margin:.4em 0 .8em}
p{margin:.6em 0}
.backlink{display:inline-block;margin-top:28px;background:var(--accent);color:#fff;font-weight:700;
 text-decoration:none;padding:14px 22px;border-radius:999px;font-size:1.05rem}
.toplink{font-size:.95rem;margin-bottom:4px}
.toplink a{color:var(--navy)}
footer{margin-top:10px}
@media (max-width:600px){body{font-size:17px}.wrap{padding:14px 12px 48px}h1{font-size:1.35rem}}
.progress-text{font-weight:700;margin:16px 0 6px;font-size:1.1rem}
.progress-bar{height:16px;background:var(--soft);border:2px solid var(--line);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);width:0;transition:width .3s}
.card-scene{perspective:1200px;margin:20px 0 6px}
.fcard{position:relative;width:100%;height:400px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s;-webkit-tap-highlight-color:transparent}
.fcard.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
 border:3px solid var(--navy);border-radius:18px;padding:24px 18px;overflow:hidden;
 display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#fff}
.face.back{transform:rotateY(180deg);background:var(--soft);border-color:var(--accent)}
.face-label{font-size:.85rem;font-weight:700;color:var(--accent);letter-spacing:.2em;margin-bottom:12px}
.face-label.ans{color:var(--navy)}
.face-text{font-size:1.3rem;font-weight:700;line-height:1.65}
.face-note{margin-top:14px;font-size:.98rem;color:#54677a;line-height:1.65}
.tap-hint{margin-top:16px;font-size:.9rem;color:#8a97a5}
.judge{display:flex;gap:12px;margin-top:16px}
.jbtn{flex:1;font-family:inherit;font-size:1.25rem;font-weight:700;padding:18px 10px;border-radius:14px;
 border:3px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer;min-height:64px}
.jbtn.known{background:var(--accent);border-color:var(--accent);color:#fff}
.jbtn:active{transform:scale(.98)}
.round-info{text-align:center;color:#54677a;font-size:.95rem;margin-top:12px}
.done-box{border:3px solid var(--accent);border-radius:18px;padding:32px 20px;text-align:center;background:#fff5f8;margin-top:22px}
.done-title{font-size:1.5rem;font-weight:700;color:#c2255c;margin:.2em 0}
.restart{max-width:340px;margin:16px auto 0;display:block;width:100%}
</style>
</head>
<body>
<div class="wrap">
<p class="toplink"><a href="iori.html">← 中3トップへ戻る</a></p>
<h1>中3国語 暗記カード｜文法と敬語</h1>
<p>カードをタップすると答えが見えます。答えを見たら「覚えた」「まだ」で教えてください。「まだ」のカードだけが次の周に出てきます。</p>
<div class="progress-text" id="progressText"></div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div id="playArea">
<div class="card-scene"><div class="fcard" id="fcard">
<div class="face front"><div class="face-label">も　ん　だ　い</div><div class="face-text" id="frontText"></div><div class="tap-hint">タップで答えを見る</div></div>
<div class="face back"><div class="face-label ans">こ　た　え</div><div class="face-text" id="backText"></div><div class="face-note" id="backNote"></div></div>
</div></div>
<div class="judge" id="judgeBtns" style="visibility:hidden">
<button class="jbtn still" id="btnStill" type="button">まだ</button>
<button class="jbtn known" id="btnKnown" type="button">覚えた</button>
</div>
<p class="round-info" id="roundInfo"></p>
</div>
<div id="doneArea" style="display:none">
<div class="done-box"><p class="done-title">🎉 全部おぼえた！</p><p id="doneText"></p>
<button class="jbtn known restart" id="btnRestart" type="button">最初からもう一度</button></div>
</div>
<footer><a class="backlink" href="iori.html">← 中3トップへ戻る</a> <a class="backlink" href="../index.html" style="background:#1a1a5e">🏠 アプリへ戻る</a></footer>
</div>
<script>
var CARDS = [
 {
  "q": "主語を見つけるには、述語に何と問いかける？",
  "a": "「何が（誰が）」と問いかけます",
  "n": "ふつう「〜が」までを含めて主語とします"
 },
 {
  "q": "述語は、文のどこにあることが多い？",
  "a": "文の最後のほうです",
  "n": "まず述語を見つけるのが、成分探しのコツです"
 },
 {
  "q": "修飾語の役割は？",
  "a": "言葉をくわしく説明することです",
  "n": "説明される言葉（被修飾語）とセットで考えます"
 },
 {
  "q": "接続語の例は？",
  "a": "しかし・だから・そして、などです",
  "n": "文と文、文節と文節をつなぎます"
 },
 {
  "q": "独立語の例は？",
  "a": "感動・呼びかけ・応答・提示のことばです",
  "n": "例：「はい」「太郎、」「あしたは、」など"
 },
 {
  "q": "品詞のうち「用言」は3つ、何？",
  "a": "動詞・形容詞・形容動詞",
  "n": "活用（形が変わること）があるのは用言だけです"
 },
 {
  "q": "動詞の「言い切り」の特徴は？",
  "a": "言い切りが ウ段 の音で終わります",
  "n": "例：書く・読む・飛ぶ"
 },
 {
  "q": "形容詞の言い切りは？",
  "a": "「〜い」で終わります",
  "n": "例：暑い・美しい"
 },
 {
  "q": "形容動詞の言い切りと、名詞を修飾するときの形は？",
  "a": "言い切りは「〜だ」、修飾するときは「〜な」です",
  "n": "例：静かだ・静かな山"
 },
 {
  "q": "敬語の3種類は？",
  "a": "尊敬語・謙譲語・丁寧語",
  "n": "動作をしているのが誰かを見て判断します"
 },
 {
  "q": "尊敬語の役割は？",
  "a": "目上の人の動作を高めて表すことです",
  "n": "例：いらっしゃる・おっしゃる・ご覧になる"
 },
 {
  "q": "謙譲語の役割は？",
  "a": "自分の動作を低くして、相手を敬うことです",
  "n": "例：伺う・参る・申す"
 },
 {
  "q": "丁寧語の例は？",
  "a": "です・ます・ございます",
  "n": "丁寧に言って聞き手を敬います"
 },
 {
  "q": "「行く・来る」の尊敬語と謙譲語は？",
  "a": "尊敬語は「いらっしゃる」、謙譲語は「参る・伺う」",
  "n": ""
 },
 {
  "q": "「見る」の尊敬語と謙譲語は？",
  "a": "尊敬語は「ご覧になる」、謙譲語は「拝見する」",
  "n": ""
 },
 {
  "q": "「言う」の尊敬語と謙譲語は？",
  "a": "尊敬語は「おっしゃる」、謙譲語は「申す・申し上げる」",
  "n": ""
 },
 {
  "q": "「食べる・飲む」の尊敬語と謙譲語は？",
  "a": "尊敬語は「召し上がる」、謙譲語は「いただく」",
  "n": ""
 },
 {
  "q": "「おっしゃられました」は、なぜ間違い？",
  "a": "二重敬語だからです",
  "n": "正しくは「おっしゃいました」。「おっしゃる」だけで尊敬語です"
 }
];
var total = CARDS.length;
var knownCount = 0;
var deck = [];
var pos = 0;
var flipped = false;
var round = 1;
function el(id){ return document.getElementById(id); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function updateProgress(){
  el('progressText').textContent = '覚えた ' + knownCount + ' / ' + total + ' 枚';
  el('progressFill').style.width = (total ? (knownCount/total*100) : 0) + '%';
}
function updateRoundInfo(){
  el('roundInfo').textContent = '第' + round + '周目｜この周はあと ' + (deck.length - pos) + ' 枚';
}
function showCard(){
  flipped = false;
  el('fcard').classList.remove('flipped');
  var c = CARDS[deck[pos]];
  el('frontText').textContent = c.q;
  el('backText').textContent = c.a;
  el('backNote').textContent = c.n || '';
  el('judgeBtns').style.visibility = 'hidden';
  updateRoundInfo();
}
function startRound(){ shuffle(deck); pos = 0; showCard(); }
function init(){
  knownCount = 0; round = 1;
  deck = CARDS.map(function(_, i){ return i; });
  el('doneArea').style.display = 'none';
  el('playArea').style.display = 'block';
  updateProgress();
  startRound();
}
function finish(){
  el('playArea').style.display = 'none';
  el('doneArea').style.display = 'block';
  el('doneText').textContent = '全' + total + '枚のカードを全部おぼえました。おつかれさま！';
}
function judge(known){
  if(!flipped) return;
  if(known){ knownCount++; deck.splice(pos, 1); }
  else { pos++; }
  updateProgress();
  if(pos >= deck.length){
    if(deck.length === 0){ finish(); return; }
    round++; startRound(); return;
  }
  showCard();
}
el('fcard').addEventListener('click', function(){
  if(flipped) return;
  flipped = true;
  this.classList.add('flipped');
  el('judgeBtns').style.visibility = 'visible';
});
el('btnKnown').addEventListener('click', function(){ judge(true); });
el('btnStill').addEventListener('click', function(){ judge(false); });
el('btnRestart').addEventListener('click', init);
init();
</script>
</body>
</html>
