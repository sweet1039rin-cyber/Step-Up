<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 384" font-family="Hiragino Kaku Gothic ProN, Hiragino Sans, Noto Sans JP, sans-serif">
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#333"/></marker></defs>
<rect x="210" y="12" width="140" height="36" rx="18" fill="#eef5fc" stroke="#2f6fb2" stroke-width="2"/>
<text x="280" y="36" text-anchor="middle" font-size="15" font-weight="bold">開始</text>
<line x1="280" y1="48" x2="280" y2="66" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/>
<polygon points="280,68 320,68 300,104 260,104" fill="#fdf3ea" stroke="#e07b39" stroke-width="2"/>
<text x="290" y="84" text-anchor="middle" font-size="12.5">センサで気温を</text>
<text x="290" y="100" text-anchor="middle" font-size="12.5">読み取る</text>
<line x1="280" y1="104" x2="280" y2="122" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/>
<polygon points="280,124 378,176 280,228 182,176" fill="#fff8e1" stroke="#b8860b" stroke-width="2"/>
<text x="280" y="172" text-anchor="middle" font-size="13.5" font-weight="bold">気温が28度</text>
<text x="280" y="190" text-anchor="middle" font-size="13.5" font-weight="bold">以上か？</text>
<line x1="378" y1="176" x2="428" y2="176" stroke="#333" stroke-width="1.8"/>
<text x="402" y="166" text-anchor="middle" font-size="13" font-weight="bold">はい</text>
<line x1="428" y1="176" x2="428" y2="238" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="353" y="240" width="150" height="42" fill="#edf7f0" stroke="#2e7d4f" stroke-width="2"/>
<text x="428" y="266" text-anchor="middle" font-size="13.5">ファンを強で回す</text>
<line x1="182" y1="176" x2="132" y2="176" stroke="#333" stroke-width="1.8"/>
<text x="156" y="166" text-anchor="middle" font-size="13" font-weight="bold">いいえ</text>
<line x1="132" y1="176" x2="132" y2="238" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="57" y="240" width="150" height="42" fill="#edf7f0" stroke="#2e7d4f" stroke-width="2"/>
<text x="132" y="266" text-anchor="middle" font-size="13.5">ファンを止めておく</text>
<line x1="428" y1="282" x2="428" y2="312" stroke="#333" stroke-width="1.8"/>
<line x1="132" y1="282" x2="132" y2="312" stroke="#333" stroke-width="1.8"/>
<line x1="132" y1="312" x2="428" y2="312" stroke="#333" stroke-width="1.8"/>
<line x1="280" y1="312" x2="280" y2="332" stroke="#333" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="210" y="334" width="140" height="36" rx="18" fill="#eef5fc" stroke="#2f6fb2" stroke-width="2"/>
<text x="280" y="358" text-anchor="middle" font-size="15" font-weight="bold">終了</text>
</svg>
