<script>
var QUESTIONS = [{"id": 1, "cat": "あらまし", "q": "シジュウカラについての「前提となる知識」として正しいものを選びなさい。<br />ア 鳴き声には意味がなく、気分で鳴いている　イ 鳴き声には意味があり、全体で「言葉」のようになっている　ウ 鳴き声は仲間を呼ぶときだけ使う　エ 鳴き声の意味は人間には分からない", "a": "<strong>イ</strong><br />筆者は、シジュウカラの鳴き声には意味があり、全体で「言葉」のようになっていると考えました。"}, {"id": 2, "cat": "あらまし", "q": "鈴木俊貴さんが研究を始める「きっかけ」となった出来事を選びなさい。<br />ア 巣箱にアオダイショウ（ヘビ）が迫り、親鳥が「ジャージャー」と鳴いた　イ 親鳥が「ピーツピ」と鳴いて飛び立った　ウ ヒナが巣から落ちた　エ カラスが巣を襲った", "a": "<strong>ア</strong><br />2008年6月、アオダイショウが巣箱に迫ったとき、親鳥が「ジャージャー」と鳴いたことがきっかけです。"}, {"id": 3, "cat": "あらまし", "q": "仮説の文の（　）に入る言葉の組み合わせとして正しいものを選びなさい。「『ジャージャー』という鳴き声は、（ a ）を意味する（ b ）なのではないか」<br />ア a ヘビ、b 単語　イ a 単語、b ヘビ　ウ a 天敵、b 命令　エ a 警戒、b 合図", "a": "<strong>ア</strong><br />仮説は「『ジャージャー』は『ヘビ』を意味する『単語』なのではないか」です。"}, {"id": 4, "cat": "検証", "q": "検証1の「目的」として正しいものを選びなさい。<br />ア 「ジャージャー」が「ヘビを意味する単語」であるかどうかを調べる　イ シジュウカラが何種類の声で鳴くかを調べる　ウ 巣箱の場所を調べる　エ ヒナの育ち方を調べる", "a": "<strong>ア</strong><br />検証1の目的は、鳴き声が「ヘビを意味する単語」かどうかを確かめることです。"}, {"id": 5, "cat": "検証", "q": "検証1の「方法」として正しいものを選びなさい。<br />ア 本物のヘビを巣箱に近づける　イ ヘビのいない状況で「ジャージャー」の録音を聞かせ、「ピーツピ」を聞かせたときや鳴き声を流さないときと比べて行動を観察する　ウ 巣箱の中にカメラを入れる　エ 親鳥を捕まえて観察する", "a": "<strong>イ</strong><br />録音を聞かせて、ほかの鳴き声のときと行動を比べるのが検証1の方法です。"}, {"id": 6, "cat": "検証", "q": "検証1の「結果」の組み合わせとして正しいものを選びなさい。<br />ア 「ジャージャー」では地面を確認し巣箱の穴をのぞいた／「ピーツピ」では首を左右に振って周囲を警戒しただけだった　イ どちらも同じ行動だった　ウ 「ピーツピ」では巣箱の穴をのぞいた　エ 「ジャージャー」ではすぐに逃げた", "a": "<strong>ア</strong><br />鳴き声によって行動がはっきり違ったことが、意味の違いを示します。"}, {"id": 7, "cat": "検証", "q": "検証2の「目的」として正しいものを選びなさい。<br />ア シジュウカラがヘビを怖がるかどうかを調べる　イ 「ジャージャー」を聞いたシジュウカラが、ヘビの姿をイメージしているかどうかを調べる　ウ 小枝を巣の材料にするかどうかを調べる　エ 鳴き声の大きさを調べる", "a": "<strong>イ</strong><br />検証2は、心の中でヘビの姿を思い浮かべているかどうかを確かめる実験です。"}, {"id": 8, "cat": "検証", "q": "検証2の「結果」として正しいものを選びなさい。<br />ア どの鳴き声でも小枝に近づいた　イ 「ジャージャー」を聞かせた場合、ヘビのように動く小枝に近づいて確認するものが多かった　ウ 「ジャージャー」以外の鳴き声で小枝に近づいた　エ 小枝には全く近づかなかった", "a": "<strong>イ</strong><br />鳴き声と動き方が合ったときにだけ近づいたことがポイントです。"}, {"id": 9, "cat": "結論", "q": "「ジャージャー」は「地面や巣箱を確認しろ」という命令ではない、と解釈できる理由として最も適切なものを選びなさい。<br />ア 親鳥が地面を確認したから　イ 検証2で、鳴き声を聞いた鳥がヘビの姿をイメージして行動していたから　ウ 親鳥の声が小さかったから　エ ヒナが鳴き声に答えたから", "a": "<strong>イ</strong><br />命令ではなく「ヘビ」という対象を思い浮かべていたと考える方が、検証2の結果と合います。"}, {"id": 10, "cat": "結論", "q": "筆者の結論として正しいものを選びなさい。<br />ア シジュウカラは一つの鳴き声しか使わない　イ シジュウカラは「単語」を使い分けるだけでなく、組み合わせる能力ももち、より複雑なメッセージを伝えている　ウ シジュウカラの鳴き声に意味はない　エ シジュウカラは人間の言葉を理解する", "a": "<strong>イ</strong><br />「単語」の使い分けと組み合わせが、筆者の結論の中心です。"}, {"id": 11, "cat": "語句", "q": "語句「分布」の意味として正しいものを選びなさい。", "a": "<strong>分かれてあちこちにあること</strong><br />「分布」は、分かれてあちこちに広がっていることです。"}, {"id": 12, "cat": "語句", "q": "語句「けたたましい」の類義語として正しいものを選びなさい。", "a": "<strong>さわがしい</strong><br />「けたたましい」は、さわがしく鳴り響く様子を表します。"}, {"id": 13, "cat": "語句", "q": "語句「耳を澄ます」の意味として正しいものを選びなさい。", "a": "<strong>集中して聞こうとすること</strong><br />周りの音に注意を向けて、よく聞こうとすることです。"}, {"id": 14, "cat": "語句", "q": "「転機」の使い方として正しい文を選びなさい。<br />ア その出来事が、彼の人生の転機となった　イ 転機を食べて元気になった　ウ 転機が空を飛んでいる　エ 転機の色は赤い", "a": "<strong>ア</strong><br />「転機」は、物事の状態が変わるきっかけとなる時期や出来事に使います。"}, {"id": 15, "cat": "説得力の工夫", "q": "この文章が説得力をもつ工夫として正しいものを選びなさい。<br />ア 別の解釈が生まれる場合に、もう一つの検証を加えて、一つの解釈に絞っている　イ 感想をたくさん書いている　ウ 難しい言葉を多く使っている　エ 結論を書いていない", "a": "<strong>ア</strong><br />検証1だけでは別の解釈もできたため、検証2を加えて解釈を絞りました。グラフや図で結果の違いを分かりやすく示すことも工夫の一つです。"}, {"id": 16, "cat": "コラム", "q": "コラムの内容と合っているものを選びなさい。<br />ア シジュウカラの言葉を聞き分けるのは親鳥だけである　イ コガラやゴジュウカラ、エゾリスもシジュウカラの言葉を聞き分けて行動し、力の強い順はゴジュウカラ、シジュウカラ、コガラである　ウ 力の強い順はコガラ、シジュウカラ、ゴジュウカラである　エ エゾリスは鳥の声を聞かない", "a": "<strong>イ</strong><br />ほかの鳥やエゾリスも、シジュウカラの言葉を利用して行動しています。"}, {"id": 17, "cat": "応用編", "q": "実験の結果として正しいものを選びなさい。<br />ア グループXの芽は、まっすぐ上に伸びた　イ グループYの芽は、穴の方向へ曲がって伸びた　ウ グループZの芽は、窓の方向へ傾いた　エ 三つのグループとも、同じ伸び方だった", "a": "<strong>イ</strong><br />Xは窓の方向へ傾き、Zはまっすぐ上に伸びました。Yだけが穴の方向へ曲がりました。", "g": "ouyou"}, {"id": 18, "cat": "応用編", "q": "「この実験では、グループごとに（　）を変えて比べている。」の（　）に入る言葉として正しいものを選びなさい。<br />ア 光の当たり方　イ 苗の種類　ウ 水の量　エ 箱の大きさ", "a": "<strong>ア</strong><br />変えたのは光の当たり方だけです。苗の種類はそろえています。", "g": "ouyou"}, {"id": 19, "cat": "応用編", "q": "植物の芽が曲がって伸びるのは、何の方向ですか。文章の中から4字で書き抜きなさい。", "a": "<strong>光の方向</strong><br />「植物の芽は、光の方向へ曲がって伸びる」とあります。", "g": "ouyou"}, {"id": 20, "cat": "応用編", "q": "この文章の構成の説明として最も適切なものを選びなさい。<br />ア 結論を最初に述べ、次にその理由を挙げている　イ 疑問を示し、実験の方法と結果を述べて、最後に分かったことをまとめている　ウ 自分の体験を中心に、感想を述べている　エ 二人の対話の形で、意見を交換している", "a": "<strong>イ</strong><br />疑問→方法→結果→分かったこと（結論）という、実験の説明文の型です。", "g": "ouyou"}, {"id": 21, "cat": "応用編", "q": "グループZ（穴のない暗い箱）を用意した理由として最も適切なものを選びなさい。<br />ア 苗の数をふやすため　イ 光が当たらない場合と比べるため　ウ 箱の丈夫さを確かめるため　エ 芽の色の変化を見るため", "a": "<strong>イ</strong><br />条件を一つだけ変えたグループと比べることで、光のはたらきが確かめられます。シジュウカラの検証で「ピーツピ」や無音と比べたのと同じ考え方です。", "g": "ouyou"}, {"id": 22, "cat": "記述", "q": "「ジャージャー」という鳴き声が、「ヘビ」を意味する「単語」だと言えるのはなぜですか。検証2の結果にふれて、四十字以内で書きなさい。", "a": "<strong>鳴き声を聞くと、ヘビのように動く小枝に近づき、ヘビの姿をイメージしていたから。</strong><br />検証2の結果（事実）→「ヘビの姿をイメージしている」という解釈の順で書くのがポイントです。理由を問う問題なので、文末は「〜から。」で終えます。"}, {"id": 23, "cat": "記述", "q": "この文章で、筆者が検証を二つ行ったのはなぜですか。三十字以内で書きなさい。", "a": "<strong>一つの結果だけでは、命令や合図という別の解釈が残るから。</strong><br />検証1だけでは「確認しろという命令（合図）」の可能性を消せなかったため、検証2を加えて解釈を一つに絞りました。"}, {"id": 24, "cat": "記述", "q": "筆者の結論を、「単語」という言葉を使って、三十字以内でまとめなさい。", "a": "<strong>単語を使い分け、組み合わせて、複雑なメッセージを伝えている。</strong><br />結論の中心は「単語の使い分け」と「組み合わせ」の2点です。この2点を入れれば、短くまとまります。"}, {"id": 25, "cat": "あらまし", "q": "この文章のあらましの流れとして正しいものを選びなさい。<br />ア 仮説→前提となる知識→きっかけ→検証→結論　イ 前提となる知識→きっかけ→仮説→検証1→検証2→結論　ウ きっかけ→結論→検証→仮説→前提となる知識　エ 検証→きっかけ→前提となる知識→結論→仮説", "a": "<strong>イ</strong><br />まず「鳴き声には意味がある」という前提があり、出来事をきっかけに仮説を立て、二つの検証で確かめて結論に進みます。"}, {"id": 26, "cat": "検証", "q": "検証1の「考察」（結果から言えること）として正しいものを選びなさい。<br />ア 「ジャージャー」を聞いた親鳥の行動は、ヘビの居場所をつき止めるのに役立つ　イ 親鳥はヘビを少しも怖がっていない　ウ 親鳥にはヒナを守る気持ちがない　エ 鳴き声にはやはり意味がなかった", "a": "<strong>ア</strong><br />地面を確認し巣箱の穴をのぞく行動は、ヘビがどこにいるかをつき止めることにつながります。"}, {"id": 27, "cat": "検証", "q": "検証2の「方法」として正しいものを選びなさい。<br />ア 本物のヘビを巣の近くに置いた　イ 鳴き声を流しながら、ぶら下げた小枝をヘビのように動かしたり、動き方を変えたりして見せた　ウ 巣箱の場所を高い木に移した　エ ヒナの鳴き声を録音した", "a": "<strong>イ</strong><br />本物のヘビではなく、小枝を「ヘビに見立てて」動かしたところが検証2の工夫です。"}, {"id": 28, "cat": "結論", "q": "「ジャージャー」は「ヘビを意味する単語である」という説明として正しいものを選びなさい。<br />ア 鳴き声が、「ヘビ」という対象そのものを表している　イ 鳴き声が、とても大きな声である　ウ 鳴き声が、とても短い音である　エ 鳴き声が、美しい音である", "a": "<strong>ア</strong><br />「単語」とは、ある対象や意味を表すものです。「ジャージャー」はヘビという対象を表しているので、単語と解釈できます。"}, {"id": 29, "cat": "語句", "q": "語句「転機」の意味として正しいものを選びなさい。<br />ア 物事の状態が変わるきっかけとなる時期や出来事　イ 機械を回転させる部品　ウ 電車を乗り換える場所　エ 天気が急に変わること", "a": "<strong>ア</strong><br />「転機」は、今までの流れが変わる分かれ目のことです。研究の「転機となった出来事」のように使います。"}, {"id": 30, "cat": "語句", "q": "語句「分布」の使い方として正しい文を選びなさい。<br />ア この鳥は、日本各地に分布している　イ 分布を食べて元気になった　ウ 分布が木の上で鳴いている　エ 分布を着て出かけた", "a": "<strong>ア</strong><br />「分布」は「分かれてあちこちにあること」なので、生き物が生息している広がりを表す文が正しい使い方です。"}, {"id": 31, "cat": "説得力の工夫", "q": "教科書のグラフ（天敵の種類ごとに、シジュウカラの反応の違いを示したもの）の働きとして正しいものを選びなさい。<br />ア 文章を長くするための飾りである　イ 鳴き声ごとの反応の違いを、目で見て分かる形で示す　ウ 写真の代わりにするためのものである　エ 筆者の気持ちを表すものである", "a": "<strong>イ</strong><br />数字やグラフにすると、言葉だけでは伝わりにくい「違い」が一目で分かり、結論を支える根拠になります。"}, {"id": 32, "cat": "あらまし", "q": "研究のきっかけとなった出来事について、正しい組み合わせを選びなさい。<br />ア 二〇〇八年六月、アオダイショウが巣箱に迫った　イ 二〇〇八年六月、カラスが巣箱に迫った　ウ 二〇一〇年六月、アオダイショウが巣箱に迫った　エ 二〇〇八年一月、タカが巣箱に迫った", "a": "<strong>ア</strong><br />時期は「二〇〇八年六月」、迫ったのはヘビ（アオダイショウ）です。このとき親鳥が「ジャージャー」と鳴いたことが、仮説のもとになりました。"}];
var GROUP_HEADS = {"ouyou": "<h2>応用編 初めて見る文章で練習</h2><p>植物の芽は、光のほうへ伸びるのだろうか。この疑問を確かめるため、次のような実験を行った。まず、同じ種類の苗を三つ用意し、グループX・Y・Zに分けた。グループXは窓辺に置いた。グループYは、側面に小さな穴を一つ開けた暗い箱の中に入れた。グループZは、穴のない暗い箱の中に入れた。一週間後に観察すると、グループXの芽は窓のある方向へ傾いて伸びていた。グループYの芽は、穴の方向へ曲がって伸びていた。グループZの芽は、どちらにも傾かず、まっすぐ上に伸びていた。この結果から、植物の芽は、光の方向へ曲がって伸びる性質があることが確かめられた。</p>"};
var DRAW = 32;
var MPAGE="quiz_chu1_finals_japanese_shijukara.html", MTITLE="中1国語 読解予想問題『言葉』をもつ鳥、シジュウカラ", MCHILD="sakuya", MN=QUESTIONS.length;
var KEY='stepup-mistakes-'+MCHILD;
function todayStr(){var d=new Date();var m=('0'+(d.getMonth()+1)).slice(-2);var day=('0'+d.getDate()).slice(-2);return d.getFullYear()+'-'+m+'-'+day;}
function load(){try{var v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)?v:[];}catch(e){return[];}}
function saveAll(a){localStorage.setItem(KEY,JSON.stringify(a));}
function findIdx(a,q){for(var i=0;i<a.length;i++){if(a[i].page===MPAGE&&a[i].q===q)return i;}return -1;}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
(function(){
  var units=[], byG={}, i, k, it;
  for(i=0;i<QUESTIONS.length;i++){it=QUESTIONS[i];
    if(it.g){if(!byG[it.g]){byG[it.g]=[];units.push(byG[it.g]);}byG[it.g].push(it);}
    else{units.push([it]);}
  }
  shuffle(units);
  var flat=[];
  for(i=0;i<units.length;i++){for(k=0;k<units[i].length;k++){flat.push(units[i][k]);}}
  var picked=flat.slice(0,Math.min(DRAW,flat.length));
  var area=document.getElementById('quizArea');
  function refreshBadges(){
    var recs=load();
    var spans=area.querySelectorAll('[data-rec]');
    for(var s=0;s<spans.length;s++){
      var id=parseInt(spans[s].getAttribute('data-rec'),10);
      var idx=findIdx(recs,id);
      spans[s].textContent=(idx>=0)?('記録済み×'+recs[idx].count):'';
    }
  }
  var seenG={};
  for(i=0;i<picked.length;i++){
    it=picked[i];
    if(it.g&&GROUP_HEADS[it.g]&&!seenG[it.g]){
      seenG[it.g]=1;
      var ph=document.createElement('div');ph.className='passage';ph.innerHTML=GROUP_HEADS[it.g];
      area.appendChild(ph);
    }
    var card=document.createElement('div');card.className='qcard';
    var head=document.createElement('div');head.className='qhead';
    var num=document.createElement('span');num.className='qnum';num.textContent='問'+(i+1);
    var cat=document.createElement('span');cat.className='qcat';cat.textContent=it.cat;
    head.appendChild(num);head.appendChild(cat);
    var body=document.createElement('div');body.className='qbody';body.innerHTML=it.q;
    var btn=document.createElement('button');btn.type='button';btn.className='abtn';btn.textContent='答えを見る';
    var box=document.createElement('div');box.className='abox';box.innerHTML=it.a;
    (function(box,btn){btn.addEventListener('click',function(){
      if(box.className.indexOf('open')>=0){box.className='abox';btn.textContent='答えを見る';}
      else{box.className='abox open';btn.textContent='答えを閉じる';}
    });})(box,btn);
    var mrow=document.createElement('div');mrow.className='mrow';
    var lab=document.createElement('label');
    var cb=document.createElement('input');cb.type='checkbox';cb.className='mcheck';cb.value=it.id;
    lab.appendChild(cb);lab.appendChild(document.createTextNode('まちがえた'));
    var rec=document.createElement('span');rec.className='rec';rec.setAttribute('data-rec',it.id);
    mrow.appendChild(lab);mrow.appendChild(rec);
    card.appendChild(head);card.appendChild(body);card.appendChild(btn);card.appendChild(box);card.appendChild(mrow);
    area.appendChild(card);
  }
  refreshBadges();
  document.getElementById('mpSave').addEventListener('click',function(){
    var cbs=area.querySelectorAll('input.mcheck:checked');
    var msg=document.getElementById('mpMsg');
    if(cbs.length===0){msg.textContent='チェックが入っていません。まちがえた問題を選んでください。';return;}
    var a=load();var t=todayStr();
    for(var i2=0;i2<cbs.length;i2++){
      var q=parseInt(cbs[i2].value,10);var idx=findIdx(a,q);
      if(idx>=0){a[idx].count+=1;a[idx].last=t;}
      else{a.push({page:MPAGE,title:MTITLE,q:q,count:1,first:t,last:t});}
    }
    saveAll(a);
    for(var i3=0;i3<cbs.length;i3++){cbs[i3].checked=false;}
    refreshBadges();
    msg.textContent=cbs.length+'件を記録しました。まちがい復習ページで待っています。';
  });
})();
</script>
