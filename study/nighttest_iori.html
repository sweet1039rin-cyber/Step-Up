var qs=[],idx=0,score=0;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function renderHistory(){
  var h=loadArr(KEY);var box=document.getElementById('ntHistory');
  if(h.length===0){box.innerHTML='<p>まだ記録がありません。</p>';return;}
  box.innerHTML=h.slice(-7).reverse().map(function(e){return '<div class="rowitem">'+e.date+'　<strong>'+e.score+'点</strong> / 10点</div>';}).join('');
}
function showQ(){
  var item=qs[idx];
  document.getElementById('ntProg').textContent='第'+(idx+1)+'問 / 10問';
  document.getElementById('ntSubj').textContent=item.s;
  document.getElementById('ntQ').textContent=item.q;
  var a=document.getElementById('ntA');a.style.display='none';a.textContent=item.a;
  document.getElementById('ntShow').style.display='block';
  document.getElementById('ntJudge').style.display='none';
}
function startTest(){
  qs=shuffle(BANK.slice()).slice(0,10);idx=0;score=0;
  document.getElementById('startArea').style.display='none';
  document.getElementById('resultArea').style.display='none';
  document.getElementById('quizArea').style.display='block';
  showQ();
}
function judge(ok){
  if(ok)score++;
  idx++;
  if(idx>=qs.length){
    document.getElementById('quizArea').style.display='none';
    var r=document.getElementById('resultArea');r.style.display='block';
    document.getElementById('ntScore').textContent=score+'点 / 10点';
    document.getElementById('ntComment').textContent=score>=8?'8点以上！よくできました。この調子で続けよう。':'おつかれさま。できなかった問題は、まちがい復習や暗記カードで復習しよう。';
    var h=loadArr(KEY);h.push({date:todayStr(),score:score});localStorage.setItem(KEY,JSON.stringify(h));
    renderHistory();
  }else{showQ();}
}
document.getElementById('ntStart').addEventListener('click',startTest);
document.getElementById('ntAgain').addEventListener('click',startTest);
document.getElementById('ntShow').addEventListener('click',function(){
  document.getElementById('ntA').style.display='block';
  document.getElementById('ntShow').style.display='none';
  document.getElementById('ntJudge').style.display='flex';
});
document.getElementById('ntOk').addEventListener('click',function(){judge(true);});
document.getElementById('ntNg').addEventListener('click',function(){judge(false);});
renderHistory();
