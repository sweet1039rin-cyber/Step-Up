<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Step Up 同期診断</title>
<style>body{font-family:sans-serif;max-width:640px;margin:30px auto;padding:20px;line-height:1.7}#status{white-space:pre-wrap;background:#f3f4f6;padding:16px;border-radius:10px}.box{font-size:20px;margin:24px 0;padding:16px;background:#fff7d6;border-radius:10px}input{width:28px;height:28px;vertical-align:middle}</style></head>
<body>
<h1>Step Up 同期診断</h1>
<div id="status">Firebaseを準備しています…</div>
<label class="box"><input id="check" type="checkbox" disabled> 2台同期テスト</label>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import {getFirestore,doc,setDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const config={apiKey:"AIzaSyDgK-YG2fcI0N1kb8io-B9GFnmPtllthQY",authDomain:"stepup-family.firebaseapp.com",projectId:"stepup-family",storageBucket:"stepup-family.firebasestorage.app",messagingSenderId:"836645248497",appId:"1:836645248497:web:130a9bc57182ec817c7850"};
const status=document.querySelector("#status"),check=document.querySelector("#check");
const show=t=>status.textContent=t;
const app=initializeApp(config);
const auth=getAuth(app),db=getFirestore(app);
onAuthStateChanged(auth,user=>{
 if(!user){show("未ログインです。通常のStep Upでログインしてから、このページを開き直してください。");return}
 const uid=user.uid,ref=doc(db,"users",uid,"syncDiagnostics","shared-check");
 show(`ログイン: ${user.email}
UID: ${uid}
保存先: users/${uid}/syncDiagnostics/shared-check
読込開始…`);
 check.disabled=false;
 onSnapshot(ref,snap=>{
  const data=snap.exists()?snap.data():{checked:false};
  check.checked=!!data.checked;
  show(`ログイン: ${user.email}
UID: ${uid}
保存先: users/${uid}/syncDiagnostics/shared-check
読込成功: ${check.checked?"チェックあり":"チェックなし"}`);
 },e=>show(`読込エラー: ${e.code||e.message}
UID: ${uid}`));
 check.onchange=async()=>{
  show(`保存中…
UID: ${uid}
値: ${check.checked}`);
  try{await setDoc(ref,{checked:check.checked,updatedAt:Date.now(),email:user.email},{merge:true});show(`保存成功
UID: ${uid}
値: ${check.checked}`)}
  catch(e){show(`保存エラー: ${e.code||e.message}
UID: ${uid}`)}
 };
});
</script></body></html>
